name: card_app
description: "集卡 Flutter App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  firebase_core: ^3.15.1
  firebase_messaging: ^15.2.10
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  flutter_svg: ^2.2.0
  http: ^1.2.0
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.16.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand-logos/
    - assets/cards/
    - assets/backgrounds/
    - assets/navigation/
    - assets/stablecoins/
